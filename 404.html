<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>ページが見つかりません | LP Portfolio</title>
<script>
  // 旧い日本語フォルダ名のURLを英語スラッグの新URLへ転送する(2026-10-03リネーム)
  (function () {
    var base = '/lp-portfolio/';
    var moved = {
      '美容エステ': 'beauty-esthe',
      '士業専門家相談': 'legal-consulting',
      '学習塾オンラインスクール': 'cram-school',
      'パーソナルジム': 'personal-gym',
      '飲食店': 'restaurant',
      'EC通販': 'ec-shop',
      '注文住宅': 'custom-home'
    };
    var path = decodeURIComponent(location.pathname);
    if (path.indexOf(base) !== 0) return;
    var rest = path.slice(base.length);
    var first = rest.split('/')[0];
    if (moved[first]) {
      location.replace(base + moved[first] + rest.slice(first.length) + location.search + location.hash);
    }
  })();
</script>
<link rel="stylesheet" href="/lp-portfolio/style.css">
</head>
<body>
  <main style="max-width:640px;margin:80px auto;padding:0 16px;text-align:center;">
    <h1>ページが見つかりません</h1>
    <p>お探しのページは移動または削除された可能性があります。</p>
    <p><a href="/lp-portfolio/">トップページへ戻る</a></p>
  </main>
</body>
</html>
