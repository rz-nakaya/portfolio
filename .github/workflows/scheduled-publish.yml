# 予約公開: publish/YYYY-MM-DD-<名前> ブランチを、その日付になったら master に取り込んで公開する
# - 毎日 16:00 JST に実行(GitHubの定時実行は遅れることがあるため、X等の告知時刻より前にしておく)
# - 取り込みに失敗した場合(master と衝突した等)はジョブが失敗し、GitHubから通知メールが届く
# - 手動実行(Actions タブの Run workflow)でも同じ判定をする。日付前のブランチは取り込まない
name: Scheduled publish

on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC = 16:00 JST
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: 公開日を過ぎた publish/ ブランチを取り込む
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          today=$(TZ=Asia/Tokyo date +%F)
          echo "今日(JST): $today"
          merged=""
          for ref in $(git for-each-ref --format='%(refname:short)' 'refs/remotes/origin/publish/'); do
            branch=${ref#origin/}
            date=$(echo "$branch" | sed -nE 's#^publish/([0-9]{4}-[0-9]{2}-[0-9]{2})-.+#\1#p')
            if [ -z "$date" ]; then
              echo "スキップ(名前に日付がない): $branch"
              continue
            fi
            if [[ "$date" > "$today" ]]; then
              echo "まだ公開日前: $branch($date)"
              continue
            fi
            echo "取り込み: $branch"
            git merge --no-ff --no-edit -m "予約公開: $branch" "$ref"
            merged="$merged $branch"
          done
          echo "merged=$merged" >> "$GITHUB_OUTPUT"

      - name: push して公開ブランチを削除
        if: steps.merge.outputs.merged != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push origin master
          for branch in ${{ steps.merge.outputs.merged }}; do
            git push origin --delete "$branch"
          done
          # Actions からの push ではサイトの再構築が始まらない場合があるため、明示的に依頼する
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "再構築の依頼に失敗(push による構築を待つ)"
